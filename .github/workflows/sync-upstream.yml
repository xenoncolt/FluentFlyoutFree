name: Sync upstream

# Every Monday, fully automatic: merge the original FluentFlyout (upstream) into the "upstream-sync" branch,
# check that it builds, open a pull request and merge it into master. If the app changed, that merge starts
# "Release installer", which publishes the new version, and installed apps update themselves.
#
# Problems are fixed by an AI (secret AI_API_KEY), guided by .github/scripts/fork-notes.md:
#   - merge conflicts: resolved so both upstream's changes and this fork's changes are kept
#   - build errors after the merge (usually upstream code using something this fork removed)
#   - upstream code mentioning premium/purchases: checked, and changed if needed so everything stays free
# Nothing is merged unless the app builds, and the pull request lists everything the AI changed.
#
# If something still needs a human (no AI key, or the AI failed), the run fails, GitHub emails you, and the
# run's summary page explains what to do. master is only changed by a pull request that built successfully.
#
# One-time setup (see installer/README.md): the repository secrets UPSTREAM_SYNC_TOKEN and AI_API_KEY.
# The token is needed to push upstream's workflow changes and to merge the pull request in a way that starts
# the release workflow (merges made with the built-in Actions token don't start other workflows).

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: unchihugo/FluentFlyout
  UPSTREAM_BRANCH: master
  BASE_BRANCH: master
  SYNC_BRANCH: upstream-sync
  # Make every gh command act on this repo. Without it, gh picks the git remote named "upstream"
  # (the original FluentFlyout) once that remote is added, and tries to open the PR there.
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Check upstream for new commits
        id: check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          git remote add upstream "https://github.com/$env:UPSTREAM_REPO.git"
          git fetch upstream $env:UPSTREAM_BRANCH --no-tags
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch $env:UPSTREAM_REPO" }

          $upstreamRef = "upstream/$env:UPSTREAM_BRANCH"
          # anything upstream has that master doesn't. A pull request still waiting for review is simply
          # rebuilt and checked again (and you get another reminder email).
          $newCommits = [int](git rev-list --count "HEAD..$upstreamRef")
          $run = $newCommits -gt 0

          if ($newCommits -eq 0) {
            "### ✅ Already up to date with $env:UPSTREAM_REPO" >> $env:GITHUB_STEP_SUMMARY
          }

          "run=$($run.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "new_commits=$newCommits" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Setup .NET
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Conflicts in app code are resolved by the AI (secret AI_API_KEY, see installer/README.md), using this
      # fork's notes in .github/scripts/fork-notes.md. Whatever it does is checked by the build below.
      - name: Merge upstream
        id: merge
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          $ErrorActionPreference = 'Continue'
          . ./.github/scripts/ai-fix.ps1
          $notes = Join-Path $env:RUNNER_TEMP 'sync-notes.md' # what was fixed automatically, for the pull request
          $upstreamRef = "upstream/$env:UPSTREAM_BRANCH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # conflicts also show the common ancestor, so the AI can see what each side changed
          git config merge.conflictStyle diff3
          git checkout -B $env:SYNC_BRANCH

          git merge $upstreamRef --no-edit -m "Merge upstream $env:UPSTREAM_REPO"
          if ($LASTEXITCODE -ne 0) {
            $aiFiles = @()
            foreach ($file in @(git diff --name-only --diff-filter=U)) {
              # stage 2 = this fork's version, stage 3 = upstream's; a missing stage means that side deleted the file
              $stages = @(git ls-files -u -- $file | ForEach-Object { ($_ -split '\s+')[2] })
              if ($stages -notcontains '2') {
                # deleted in this fork on purpose (premium code, upstream-only workflows): keep it deleted
                git rm --quiet -- $file
                "- Kept deleted (this fork removed it, upstream edited it): ``$file``" >> $notes
              } elseif ($stages -notcontains '3') {
                # upstream deleted a file this fork changed: follow upstream (the build checks the result)
                git rm --quiet -- $file
                "- Deleted like upstream did (this fork had changed it): ``$file``" >> $notes
              } elseif ($file -like '.github/*' -or $file -like '*.md') {
                # this fork's own workflows and documents
                git checkout --ours -- $file
                git add -- $file
                "- Kept this fork's version of ``$file``" >> $notes
              } elseif (-not (Select-String -LiteralPath $file -Pattern '^<{7}' -Quiet)) {
                # binary file (no conflict markers): take upstream's
                git checkout --theirs -- $file
                git add -- $file
                "- Took upstream's version of ``$file``" >> $notes
              } else {
                $aiFiles += $file
              }
            }

            $failed = @()
            if ($aiFiles.Count -gt 0 -and -not (Test-AiConfigured)) {
              $failed = @($aiFiles | ForEach-Object { "- ``$_``" })
            } else {
              foreach ($file in $aiFiles) {
                Write-Host "Asking the AI to resolve the conflicts in $file"
                try {
                  $r = Resolve-ConflictsWithAi -Path $file -OursRef HEAD -TheirsRef $upstreamRef
                  git add -- $file
                  "- 🤖 AI resolved $($r.Count) conflict(s) in ``$file``$(if ($r.Summary) { ": $($r.Summary)" })" >> $notes
                } catch {
                  $failed += "- ``$file``: $($_.Exception.Message)"
                }
              }
            }

            if ($failed.Count -gt 0) {
              git merge --abort
              $why = if (-not (Test-AiConfigured)) {
                @(
                  "Upstream and this fork changed the same lines in these files:"
                  ""
                  $failed
                  ""
                  "The sync can resolve this by itself with a free AI key: add the ``AI_API_KEY`` secret"
                  "(see ``installer/README.md``), then **Actions → Sync upstream → Run workflow**."
                )
              } else {
                @(
                  "Upstream and this fork changed the same lines, and the AI couldn't resolve them this time:"
                  ""
                  $failed
                  ""
                  "The next weekly run tries again. To try now: **Actions → Sync upstream → Run workflow**."
                )
              }
              @(
                "## ⚠️ Upstream changes conflict with this fork"
                ""
                $why
                ""
                "Nothing was changed in your repository."
                ""
                "<details><summary>Merging by hand instead</summary>"
                ""
                '```'
                "git checkout $env:BASE_BRANCH"
                "git pull"
                "git fetch upstream"
                "git merge upstream/$env:UPSTREAM_BRANCH"
                '```'
                ""
                "Fix the conflicting files, then ``git commit`` and ``git push``. To cancel: ``git merge --abort``."
                ""
                "</details>"
              ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              exit 1
            }

            git commit --no-edit
            if ($LASTEXITCODE -ne 0) { throw "Could not commit the merge" }
          }
          exit 0

      # Build errors (usually upstream code using something this fork removed) are fixed by the AI, at most
      # two rounds. Nothing is merged unless the app builds.
      - name: Build merged code
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          $ErrorActionPreference = 'Continue'
          . ./.github/scripts/ai-fix.ps1
          $notes = Join-Path $env:RUNNER_TEMP 'sync-notes.md'
          $log = Join-Path $env:RUNNER_TEMP 'build.log'

          $ok = Invoke-AppBuild $log
          $fixes = @()
          $aiError = ''
          for ($round = 1; -not $ok -and $round -le 2 -and (Test-AiConfigured); $round++) {
            $errors = Get-BuildErrors (Get-Content $log)
            Write-Host "Asking the AI to fix $($errors.Count) build error(s) (round $round)"
            try {
              $fixes += Repair-BuildWithAi -Errors $errors -BaseRef $env:BASE_BRANCH
            } catch {
              $aiError = $_.Exception.Message
              Write-Host "The AI couldn't fix the build: $aiError"
              break
            }
            $ok = Invoke-AppBuild $log
          }

          if ($ok -and $fixes.Count -gt 0) {
            git add -u -- FluentFlyoutWPF FluentFlyout.SourceGenerators
            git commit -m "Fix build after merging upstream (AI)"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit the build fix" }
            foreach ($r in $fixes) {
              $files = ($r.Files | ForEach-Object { "``$_``" }) -join ', '
              "- 🔧 AI fixed build errors in ${files}$(if ($r.Summary) { ": $($r.Summary)" })" >> $notes
            }
          }

          if (-not $ok) {
            $all = Get-BuildErrors (Get-Content $log)
            $errors = @($all | Select-Object -First 20 | ForEach-Object { $_.Text })
            $what = if (-not (Test-AiConfigured)) {
              "The sync can fix this by itself with a free AI key: add the ``AI_API_KEY`` secret (see ``installer/README.md``), then **Actions → Sync upstream → Run workflow**."
            } else {
              "The AI couldn't fix it this time$(if ($aiError) { " ($aiError)" }). The next weekly run tries again. To try now: **Actions → Sync upstream → Run workflow**."
            }
            @(
              "## ❌ The merged code doesn't build"
              ""
              "This usually means upstream added code that uses something this fork removed (for example the premium/licence code)."
              $what
              ""
              "Nothing was changed in your repository."
              ""
              '```'
              $errors
              '```'
            ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }
          exit 0

      # Upstream code that could bring back paid features or purchase prompts. The AI checks it and, if needed,
      # changes it so everything stays free. Without the AI (or if its change doesn't build) the pull request
      # waits for your review instead of merging itself.
      - name: Check for premium code
        id: premium
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_ENDPOINT: ${{ vars.AI_ENDPOINT }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          $ErrorActionPreference = 'Continue'
          . ./.github/scripts/ai-fix.ps1
          $notes = Join-Path $env:RUNNER_TEMP 'sync-notes.md'
          $held = Join-Path $env:RUNNER_TEMP 'premium-held.md'

          $findings = Find-PremiumCode -BaseRef $env:BASE_BRANCH
          $reviewed = $findings.Count -eq 0
          if (-not $reviewed -and (Test-AiConfigured)) {
            Write-Host "Asking the AI to check upstream's premium-related code in $($findings.Count) file(s)"
            try {
              $r = Invoke-PremiumReviewWithAi -Findings $findings -BaseRef $env:BASE_BRANCH
              if (-not $r.Changed) {
                "- 🆓 AI checked upstream's premium-related code: $($r.Summary)" >> $notes
                $reviewed = $true
              } elseif (Invoke-AppBuild (Join-Path $env:RUNNER_TEMP 'build-premium.log')) {
                git add -u -- FluentFlyoutWPF FluentFlyout.SourceGenerators
                git commit -m "Keep every feature free after merging upstream (AI)"
                if ($LASTEXITCODE -ne 0) { throw "Could not commit the change" }
                $files = ($r.Files | ForEach-Object { "``$_``" }) -join ', '
                "- 🆓 AI changed upstream's premium-related code in ${files}: $($r.Summary)" >> $notes
                $reviewed = $true
              } else {
                Write-Host "The AI's change doesn't build; undoing it"
                git checkout -- .
              }
            } catch {
              Write-Host "The AI couldn't check the premium code: $($_.Exception.Message)"
              git checkout -- .
            }
          }

          if (-not $reviewed) {
            $findings | ForEach-Object { "- ``$($_.Path)`` ($($_.Count) line(s))" } | Out-File $held -Encoding utf8
          }
          "held=$((-not $reviewed).ToString().ToLower())" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Push branch, open and merge pull request
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          HAS_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
          PREMIUM_HELD: ${{ steps.premium.outputs.held }}
          AI_KEY_SET: ${{ secrets.AI_API_KEY != '' && 'true' || '' }}
        run: |
          $ErrorActionPreference = 'Continue'
          $upstreamRef = "upstream/$env:UPSTREAM_BRANCH"
          $upstreamSha = git rev-parse --short $upstreamRef

          $pushOutput = git push --force origin "HEAD:refs/heads/$env:SYNC_BRANCH" 2>&1 | Out-String
          Write-Host $pushOutput
          if ($LASTEXITCODE -ne 0) {
            if ($pushOutput -match 'workflow') {
              @(
                "## 🔑 Needs the UPSTREAM_SYNC_TOKEN secret"
                ""
                "Upstream changed its GitHub workflow files, and GitHub doesn't allow the built-in Actions token"
                "to push those. Add the ``UPSTREAM_SYNC_TOKEN`` secret (see ``installer/README.md``) and run this"
                "workflow again (Actions -> Sync upstream -> Run workflow)."
              ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            } else {
              "## ❌ Could not push the ``$env:SYNC_BRANCH`` branch" >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
              $pushOutput >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
            }
            exit 1
          }

          # premium-related code the "Check for premium code" step couldn't clear automatically
          $premiumFiles = @()
          $heldFile = Join-Path $env:RUNNER_TEMP 'premium-held.md'
          if ($env:PREMIUM_HELD -eq 'true' -and (Test-Path $heldFile)) { $premiumFiles = @(Get-Content $heldFile -Encoding utf8 | Where-Object { $_ }) }

          # what was fixed automatically (conflicts, build errors, premium code); no @ so nobody gets pinged
          $notesFile = Join-Path $env:RUNNER_TEMP 'sync-notes.md'
          $fixNotes = @()
          if (Test-Path $notesFile) {
            $fixNotes = @(Get-Content $notesFile -Encoding utf8 | Where-Object { $_ } | ForEach-Object { '  ' + ($_ -replace '(?<![\w.])@(?=[A-Za-z0-9])', '') })
          }

          # does this update change the app? (keep in sync with the "paths" of release.yml)
          $appPaths = @(
            'FluentFlyoutWPF', 'FluentFlyout.SourceGenerators', 'FluentFlyoutMSIX/Package.appxmanifest',
            'FluentFlyout.sln', 'installer/FluentFlyoutFree.iss', 'installer/build-installer.ps1'
          )
          $appChanged = [bool](git diff --name-only $env:BASE_BRANCH HEAD -- @appPaths)

          $hasToken = $env:HAS_SYNC_TOKEN -eq 'true'
          $autoMerge = $hasToken -and $premiumFiles.Count -eq 0

          # shown inside a code block, so @names and #numbers in upstream's commit messages don't ping or link anyone
          $commits = git log --no-merges --format='%h %s' "$env:BASE_BRANCH..$upstreamRef" | Select-Object -First 40
          $commitCount = [int](git rev-list --no-merges --count "$env:BASE_BRANCH..$upstreamRef")

          # the version "Release installer" will publish after this PR is merged
          $nextVersion = $null
          $versionLine = "- 📦 Only files outside the app changed, so merging doesn't publish a new release"
          if ($appChanged) {
            $versionLine = "- 📦 Merging publishes a new release"
            try {
              $latestTag = (gh release view --json tagName --jq '.tagName' 2>&1 | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) { $latestTag = '' }
              $next = ./installer/next-version.ps1 -LatestTag $latestTag -UpstreamRef $upstreamRef
              if ($next.Version -and $next.Bump -ne 'none') {
                $nextVersion = $next.Version
                $versionLine = "- 📦 Merging publishes **v$($next.Version)** ($($next.Bump): $($next.Reason))"
              }
            } catch {
              Write-Host "Could not predict the next version: $_"
            }
          }

          $body = @(
            "Automated merge of the latest changes from [$env:UPSTREAM_REPO](https://github.com/$env:UPSTREAM_REPO) (``$upstreamSha``)."
            ""
          )
          if ($fixNotes.Count -gt 0) {
            $body += "- ✅ Merged; fixed automatically:"
            $body += $fixNotes
          } else {
            $body += "- ✅ Merged without conflicts"
          }
          $body += "- ✅ Builds successfully"
          if ($versionLine) { $body += $versionLine }
          if ($premiumFiles.Count -gt 0) {
            $body += @(
              ""
              "> [!WARNING]"
              "> Upstream added code mentioning premium/purchases and it couldn't be checked automatically"
              "> (no ``AI_API_KEY`` secret, or the AI failed), so this pull request was **not merged automatically**."
              "> Check that nothing gets locked or shows a purchase prompt:"
              ($premiumFiles | ForEach-Object { "> $_" })
              ""
              "When it looks fine, merge it with **Create a merge commit** (not *Squash* or *Rebase*: those make every"
              "future sync conflict). The release starts by itself after merging."
            )
          } elseif (-not $hasToken) {
            $body += @(
              ""
              "Not merged automatically because the ``UPSTREAM_SYNC_TOKEN`` secret is missing (see ``installer/README.md``)."
              "Merge it with **Create a merge commit**; the release starts by itself after merging."
            )
          } else {
            $body += @("", "🤖 This pull request merges itself once it's open.")
          }
          $body += @(
            ""
            "<details><summary>$commitCount upstream commit(s)</summary>"
            ""
            '```text'
            ($commits -replace '```', "'''")
            $(if ($commitCount -gt 40) { "…" })
            '```'
            ""
            "</details>"
          )
          $bodyFile = Join-Path $env:RUNNER_TEMP 'pr-body.md'
          $body | Out-File $bodyFile -Encoding utf8

          $title = "Sync with upstream FluentFlyout ($upstreamSha)"
          $existing = gh pr list --head $env:SYNC_BRANCH --base $env:BASE_BRANCH --state open --json number --jq '.[0].number'
          if ($existing) {
            $prOutput = gh pr edit $existing --title $title --body-file $bodyFile 2>&1 | Out-String
            $prOk = $LASTEXITCODE -eq 0
            $prUrl = gh pr view $existing --json url --jq '.url'
          } else {
            $prOutput = gh pr create --base $env:BASE_BRANCH --head $env:SYNC_BRANCH --title $title --body-file $bodyFile 2>&1 | Out-String
            $prOk = $LASTEXITCODE -eq 0
            $prUrl = if ($prOutput -match 'https://github\.com/\S+/pull/\d+') { $Matches[0] } else { $null }
          }
          Write-Host $prOutput

          if (-not $prOk -or -not $prUrl) {
            @(
              "## ⚠️ Merged and built, but the pull request couldn't be opened automatically"
              ""
              "Open it yourself: https://github.com/${env:GITHUB_REPOSITORY}/compare/${env:BASE_BRANCH}...${env:SYNC_BRANCH}?expand=1"
              ""
              "GitHub's answer is below. If it says the action isn't allowed, check that the ``UPSTREAM_SYNC_TOKEN``"
              "secret is set and its token has **Pull requests: Read and write** (or tick Settings → Actions → General →"
              "*Allow GitHub Actions to create and approve pull requests*), then run this workflow again."
              ""
              '```'
              $prOutput.Trim()
              '```'
            ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }

          # needs a human: leave the pull request open and fail the run, so GitHub emails you
          if (-not $autoMerge) {
            if ($premiumFiles.Count -gt 0) {
              @(
                "## 👀 Needs your review: $prUrl"
                ""
                "Upstream added code mentioning premium/purchases and it couldn't be checked automatically, so the"
                "pull request wasn't merged:"
                ""
                $premiumFiles
                ""
                "Check that nothing gets locked or shows a purchase prompt, then merge it with **Create a merge commit**."
                "The release starts by itself after merging."
                ""
                $(if (-not $env:AI_KEY_SET) {
                  "With the free ``AI_API_KEY`` secret (see ``installer/README.md``) the sync checks this by itself."
                } else {
                  "The AI couldn't check it this time; the next weekly run tries again."
                })
              ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            } else {
              @(
                "## 🔑 Pull request ready, but not merged automatically: $prUrl"
                ""
                "The ``UPSTREAM_SYNC_TOKEN`` secret is missing (see ``installer/README.md``). Merge the pull request"
                "with **Create a merge commit**; the release starts by itself after merging."
              ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
            exit 1
          }

          # Merge it. This uses UPSTREAM_SYNC_TOKEN, so the push to master starts "Release installer"
          # (a merge made with the built-in Actions token wouldn't). GitHub may need a moment after opening
          # a pull request before it can be merged, so retry a few times.
          $merged = $false
          for ($attempt = 1; $attempt -le 5 -and -not $merged; $attempt++) {
            $mergeOutput = gh pr merge $prUrl --merge 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0) { $merged = $true; break }
            Write-Host "Merge attempt $attempt failed: $mergeOutput"
            Start-Sleep -Seconds 15
          }
          if (-not $merged) {
            @(
              "## ⚠️ Pull request ready, but merging it failed: $prUrl"
              ""
              "Merge it with **Create a merge commit**; the release starts by itself after merging. GitHub's answer:"
              ""
              '```'
              $mergeOutput.Trim()
              '```'
            ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }

          "## ✅ Merged into ``$env:BASE_BRANCH``: $prUrl" >> $env:GITHUB_STEP_SUMMARY
          if ($appChanged) {
            $what = if ($nextVersion) { "v$nextVersion" } else { "the new version" }
            "**Release installer** is now publishing $what (see the Actions tab). Installed apps update themselves." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Only files outside the app changed, so no new release." >> $env:GITHUB_STEP_SUMMARY
          }
          if ($fixNotes.Count -gt 0) {
            @("", "Fixed automatically:", "", ($fixNotes | ForEach-Object { $_.TrimStart() })) |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          exit 0
