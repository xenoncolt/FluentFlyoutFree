name: Sync upstream

# Every Monday, fully automatic: merge the original FluentFlyout (upstream) into the "upstream-sync" branch,
# check that it builds, open a pull request and merge it into master. If the app changed, that merge starts
# "Release installer", which publishes the new version, and installed apps update themselves.
#
# If something needs a human, the run fails, GitHub emails you, and the run's summary page explains what to do:
#   - merge conflicts or build errors (nothing is changed in master)
#   - upstream added premium/purchase code: the pull request stays open for you to check and merge by hand
#     (the release still starts by itself after you merge)
#
# One-time setup (see installer/README.md): the repository secret UPSTREAM_SYNC_TOKEN. It is needed to push
# upstream's workflow changes and to merge the pull request in a way that starts the release workflow
# (merges made with the built-in Actions token don't start other workflows).

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: unchihugo/FluentFlyout
  UPSTREAM_BRANCH: master
  BASE_BRANCH: master
  SYNC_BRANCH: upstream-sync
  # Make every gh command act on this repo. Without it, gh picks the git remote named "upstream"
  # (the original FluentFlyout) once that remote is added, and tries to open the PR there.
  GH_REPO: ${{ github.repository }}

jobs:
  sync:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      - name: Check upstream for new commits
        id: check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          git remote add upstream "https://github.com/$env:UPSTREAM_REPO.git"
          git fetch upstream $env:UPSTREAM_BRANCH --no-tags
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch $env:UPSTREAM_REPO" }

          $upstreamRef = "upstream/$env:UPSTREAM_BRANCH"
          # anything upstream has that master doesn't. A pull request still waiting for review is simply
          # rebuilt and checked again (and you get another reminder email).
          $newCommits = [int](git rev-list --count "HEAD..$upstreamRef")
          $run = $newCommits -gt 0

          if ($newCommits -eq 0) {
            "### ✅ Already up to date with $env:UPSTREAM_REPO" >> $env:GITHUB_STEP_SUMMARY
          }

          "run=$($run.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "new_commits=$newCommits" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Merge upstream
        id: merge
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B $env:SYNC_BRANCH

          git merge "upstream/$env:UPSTREAM_BRANCH" --no-edit -m "Merge upstream $env:UPSTREAM_REPO"
          $autoResolved = @()

          if ($LASTEXITCODE -ne 0) {
            # files this fork deleted on purpose (premium code, upstream-only workflows):
            # if upstream edited them, keep them deleted
            $forkDeleted = @(
              'FluentFlyoutWPF/Classes/LicenseManager.cs',
              'FluentFlyoutWPF/Controls/PremiumPurchaseButton.xaml',
              'FluentFlyoutWPF/Controls/PremiumPurchaseButton.xaml.cs',
              'FluentFlyoutWPF/Controls/PremiumUnlockedBanner.xaml',
              'FluentFlyoutWPF/Controls/PremiumUnlockedBanner.xaml.cs',
              'FluentFlyoutWPF/Controls/AccentBadge.xaml',
              'FluentFlyoutWPF/Controls/AccentBadge.xaml.cs',
              '.github/workflows/cla-assistant.yml',
              '.github/workflows/notify-website.yml',
              '.github/workflows/build-msix.yml'
            )

            $remaining = @()
            foreach ($file in @(git diff --name-only --diff-filter=U)) {
              if ($forkDeleted -contains $file) {
                git rm --quiet -- $file
                $autoResolved += $file
              } else {
                $remaining += $file
              }
            }

            if ($remaining.Count -gt 0) {
              git merge --abort
              @(
                "## ⚠️ Upstream changes conflict with this fork"
                ""
                "Upstream and this fork changed the same lines in these files, so they can't be merged automatically:"
                ""
                ($remaining | ForEach-Object { "- ``$_``" })
                ""
                "Nothing was changed in your repository. To merge by hand on your PC:"
                ""
                '```'
                "git checkout $env:BASE_BRANCH"
                "git pull"
                "git fetch upstream"
                "git merge upstream/$env:UPSTREAM_BRANCH"
                '```'
                ""
                "Fix the files listed above (or ask an assistant to), then ``git commit`` and ``git push``."
                "To cancel a merge you started: ``git merge --abort``."
              ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              exit 1
            }

            git commit --no-edit
            if ($LASTEXITCODE -ne 0) { throw "Could not commit the merge" }
          }

          "auto_resolved=$($autoResolved -join ',')" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Setup .NET
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build merged code
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          dotnet build FluentFlyoutWPF/FluentFlyout.csproj -c Release -p:Platform=x64 -nologo 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $errors = Select-String -Path build.log -Pattern ': error ' |
              ForEach-Object { ($_.Line -replace '\s*\[[^\]]*\]$', '').Trim() } |
              Sort-Object -Unique | Select-Object -First 20
            @(
              "## ❌ The merged code doesn't build"
              ""
              "Upstream merged without conflicts, but the result has build errors. This usually means"
              "upstream added code that uses something this fork removed (for example the premium/licence code)."
              "Nothing was changed in your repository."
              ""
              '```'
              $errors
              '```'
            ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }
          exit 0

      - name: Push branch, open and merge pull request
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
          HAS_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN != '' }}
          AUTO_RESOLVED: ${{ steps.merge.outputs.auto_resolved }}
        run: |
          $ErrorActionPreference = 'Continue'
          $upstreamRef = "upstream/$env:UPSTREAM_BRANCH"
          $upstreamSha = git rev-parse --short $upstreamRef

          $pushOutput = git push --force origin "HEAD:refs/heads/$env:SYNC_BRANCH" 2>&1 | Out-String
          Write-Host $pushOutput
          if ($LASTEXITCODE -ne 0) {
            if ($pushOutput -match 'workflow') {
              @(
                "## 🔑 Needs the UPSTREAM_SYNC_TOKEN secret"
                ""
                "Upstream changed its GitHub workflow files, and GitHub doesn't allow the built-in Actions token"
                "to push those. Add the ``UPSTREAM_SYNC_TOKEN`` secret (see ``installer/README.md``) and run this"
                "workflow again (Actions -> Sync upstream -> Run workflow)."
              ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            } else {
              "## ❌ Could not push the ``$env:SYNC_BRANCH`` branch" >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
              $pushOutput >> $env:GITHUB_STEP_SUMMARY
              '```' >> $env:GITHUB_STEP_SUMMARY
            }
            exit 1
          }

          # Lines upstream added that could bring back paid features or purchase prompts. These stop the
          # automatic merge. Not counted: checks of IsPremiumUnlocked / IsStoreVersion (always "unlocked" and
          # "not the Store version" in this fork) and translations. Code using the premium controls/classes this
          # fork deleted doesn't get here: it fails the build step instead.
          $premiumFiles = @()
          $changedFiles = git diff --name-only $env:BASE_BRANCH HEAD -- FluentFlyoutWPF ':(exclude)FluentFlyoutWPF/Resources/Localization'
          foreach ($file in $changedFiles) {
            $hits = @(git diff -U0 $env:BASE_BRANCH HEAD -- $file | Where-Object {
              $_ -match '^\+(?!\+\+)' -and
              ($_ -replace '\b(IsPremiumUnlocked|IsStoreVersion)\b', '') -match 'Premium|LicenseManager|StoreContext|RequestPurchase'
            })
            if ($hits.Count -gt 0) { $premiumFiles += "- ``$file`` ($($hits.Count) line(s))" }
          }

          # does this update change the app? (keep in sync with the "paths" of release.yml)
          $appPaths = @(
            'FluentFlyoutWPF', 'FluentFlyout.SourceGenerators', 'FluentFlyoutMSIX/Package.appxmanifest',
            'FluentFlyout.sln', 'installer/FluentFlyoutFree.iss', 'installer/build-installer.ps1'
          )
          $appChanged = [bool](git diff --name-only $env:BASE_BRANCH HEAD -- @appPaths)

          $hasToken = $env:HAS_SYNC_TOKEN -eq 'true'
          $autoMerge = $hasToken -and $premiumFiles.Count -eq 0

          # shown inside a code block, so @names and #numbers in upstream's commit messages don't ping or link anyone
          $commits = git log --no-merges --format='%h %s' "$env:BASE_BRANCH..$upstreamRef" | Select-Object -First 40
          $commitCount = [int](git rev-list --no-merges --count "$env:BASE_BRANCH..$upstreamRef")

          # the version "Release installer" will publish after this PR is merged
          $nextVersion = $null
          $versionLine = "- 📦 Only files outside the app changed, so merging doesn't publish a new release"
          if ($appChanged) {
            $versionLine = "- 📦 Merging publishes a new release"
            try {
              $latestTag = (gh release view --json tagName --jq '.tagName' 2>&1 | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) { $latestTag = '' }
              $next = ./installer/next-version.ps1 -LatestTag $latestTag -UpstreamRef $upstreamRef
              if ($next.Version -and $next.Bump -ne 'none') {
                $nextVersion = $next.Version
                $versionLine = "- 📦 Merging publishes **v$($next.Version)** ($($next.Bump): $($next.Reason))"
              }
            } catch {
              Write-Host "Could not predict the next version: $_"
            }
          }

          $body = @(
            "Automated merge of the latest changes from [$env:UPSTREAM_REPO](https://github.com/$env:UPSTREAM_REPO) (``$upstreamSha``)."
            ""
            "- ✅ Merged without conflicts"
            "- ✅ Builds successfully"
          )
          if ($versionLine) { $body += $versionLine }
          if ($env:AUTO_RESOLVED) {
            $body += "- ℹ️ Upstream edited premium files this fork removed; they were kept removed: $($env:AUTO_RESOLVED -replace ',', ', ')"
          }
          if ($premiumFiles.Count -gt 0) {
            $body += @(
              ""
              "> [!WARNING]"
              "> Upstream added code mentioning premium/purchases, so this pull request was **not merged automatically**."
              "> Check that nothing gets locked or shows a purchase prompt:"
              ($premiumFiles | ForEach-Object { "> $_" })
              ""
              "When it looks fine, merge it with **Create a merge commit** (not *Squash* or *Rebase*: those make every"
              "future sync conflict). The release starts by itself after merging."
            )
          } elseif (-not $hasToken) {
            $body += @(
              ""
              "Not merged automatically because the ``UPSTREAM_SYNC_TOKEN`` secret is missing (see ``installer/README.md``)."
              "Merge it with **Create a merge commit**; the release starts by itself after merging."
            )
          } else {
            $body += @("", "🤖 This pull request merges itself once it's open.")
          }
          $body += @(
            ""
            "<details><summary>$commitCount upstream commit(s)</summary>"
            ""
            '```text'
            ($commits -replace '```', "'''")
            $(if ($commitCount -gt 40) { "…" })
            '```'
            ""
            "</details>"
          )
          $bodyFile = Join-Path $env:RUNNER_TEMP 'pr-body.md'
          $body | Out-File $bodyFile -Encoding utf8

          $title = "Sync with upstream FluentFlyout ($upstreamSha)"
          $existing = gh pr list --head $env:SYNC_BRANCH --base $env:BASE_BRANCH --state open --json number --jq '.[0].number'
          if ($existing) {
            $prOutput = gh pr edit $existing --title $title --body-file $bodyFile 2>&1 | Out-String
            $prOk = $LASTEXITCODE -eq 0
            $prUrl = gh pr view $existing --json url --jq '.url'
          } else {
            $prOutput = gh pr create --base $env:BASE_BRANCH --head $env:SYNC_BRANCH --title $title --body-file $bodyFile 2>&1 | Out-String
            $prOk = $LASTEXITCODE -eq 0
            $prUrl = if ($prOutput -match 'https://github\.com/\S+/pull/\d+') { $Matches[0] } else { $null }
          }
          Write-Host $prOutput

          if (-not $prOk -or -not $prUrl) {
            @(
              "## ⚠️ Merged and built, but the pull request couldn't be opened automatically"
              ""
              "Open it yourself: https://github.com/${env:GITHUB_REPOSITORY}/compare/${env:BASE_BRANCH}...${env:SYNC_BRANCH}?expand=1"
              ""
              "GitHub's answer is below. If it says the action isn't allowed, check that the ``UPSTREAM_SYNC_TOKEN``"
              "secret is set and its token has **Pull requests: Read and write** (or tick Settings → Actions → General →"
              "*Allow GitHub Actions to create and approve pull requests*), then run this workflow again."
              ""
              '```'
              $prOutput.Trim()
              '```'
            ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }

          # needs a human: leave the pull request open and fail the run, so GitHub emails you
          if (-not $autoMerge) {
            if ($premiumFiles.Count -gt 0) {
              @(
                "## 👀 Needs your review: $prUrl"
                ""
                "Upstream added code mentioning premium/purchases, so the pull request wasn't merged automatically:"
                ""
                $premiumFiles
                ""
                "Check that nothing gets locked or shows a purchase prompt, then merge it with **Create a merge commit**."
                "The release starts by itself after merging."
              ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            } else {
              @(
                "## 🔑 Pull request ready, but not merged automatically: $prUrl"
                ""
                "The ``UPSTREAM_SYNC_TOKEN`` secret is missing (see ``installer/README.md``). Merge the pull request"
                "with **Create a merge commit**; the release starts by itself after merging."
              ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
            exit 1
          }

          # Merge it. This uses UPSTREAM_SYNC_TOKEN, so the push to master starts "Release installer"
          # (a merge made with the built-in Actions token wouldn't). GitHub may need a moment after opening
          # a pull request before it can be merged, so retry a few times.
          $merged = $false
          for ($attempt = 1; $attempt -le 5 -and -not $merged; $attempt++) {
            $mergeOutput = gh pr merge $prUrl --merge 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0) { $merged = $true; break }
            Write-Host "Merge attempt $attempt failed: $mergeOutput"
            Start-Sleep -Seconds 15
          }
          if (-not $merged) {
            @(
              "## ⚠️ Pull request ready, but merging it failed: $prUrl"
              ""
              "Merge it with **Create a merge commit**; the release starts by itself after merging. GitHub's answer:"
              ""
              '```'
              $mergeOutput.Trim()
              '```'
            ) | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }

          "## ✅ Merged into ``$env:BASE_BRANCH``: $prUrl" >> $env:GITHUB_STEP_SUMMARY
          if ($appChanged) {
            $what = if ($nextVersion) { "v$nextVersion" } else { "the new version" }
            "**Release installer** is now publishing $what (see the Actions tab). Installed apps update themselves." >> $env:GITHUB_STEP_SUMMARY
          } else {
            "Only files outside the app changed, so no new release." >> $env:GITHUB_STEP_SUMMARY
          }
          exit 0
